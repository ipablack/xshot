name: xshot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xshot-${{ github.ref }}
  cancel-in-progress: false
env:
  XSHOT_LICENSE_URL: ${{ vars.XSHOT_LICENSE_URL }}
  XSHOT_PUBLIC_KEY_SPKI: ${{ vars.XSHOT_PUBLIC_KEY_SPKI }}
  XSHOT_KEY_ID: ${{ vars.XSHOT_KEY_ID || 'xshot-1' }}
  # Public source archive; no private keys or activation codes are embedded.
  XSHOT_SOURCE_SHA256: cee1ed16173dc1fe41ca33833db5c71a3d55a9f4b853b0699298545bec7551bb
  XSHOT_SOURCE_PAYLOAD: 
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore xshot source if only this workflow was uploaded
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,os,tarfile
          required=['backend/src/worker.mjs','android/app/build.gradle','ios/build_framework.sh']
          if all(Path(p).is_file() for p in required):
              print('Using checked-out xshot source.')
              raise SystemExit(0)
          data=base64.b64decode(os.environ['XSHOT_SOURCE_PAYLOAD'],validate=True)
          if hashlib.sha256(data).hexdigest()!=os.environ['XSHOT_SOURCE_SHA256']:
              raise SystemExit('Embedded source checksum mismatch')
          root=Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tar:
              for member in tar:
                  destination=(root/member.name).resolve()
                  if not member.isfile() or not destination.is_relative_to(root):
                      raise SystemExit('Unsafe source archive member')
                  stream=tar.extractfile(member)
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  destination.write_bytes(stream.read())
          print('Restored public xshot source.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify licensing and Java interoperability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-reports
          node --test backend/tests/licensing.test.mjs | tee build-reports/backend-tests.txt
          node tools/verify-java.mjs | tee build-reports/java-interop.txt
      - name: Package readable source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          roots=['android','ios','backend','tools','tests','verification','.github']
          with zipfile.ZipFile('build-reports/xshot-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for root in roots:
                  for p in sorted(Path(root).rglob('*')):
                      if p.is_file() and not {'build','.gradle','node_modules','__pycache__'} & set(p.parts): z.write(p,Path('xshot')/p)
              for name in ['README_AR.md','.gitignore']:
                  if Path(name).is_file(): z.write(name,'xshot/'+name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xshot-source
          path: build-reports/
          if-no-files-found: error
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore xshot source if needed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,os,tarfile
          required=['backend/src/worker.mjs','android/app/build.gradle','ios/build_framework.sh']
          if all(Path(p).is_file() for p in required):
              print('Using checked-out xshot source.')
              raise SystemExit(0)
          data=base64.b64decode(os.environ['XSHOT_SOURCE_PAYLOAD'],validate=True)
          if hashlib.sha256(data).hexdigest()!=os.environ['XSHOT_SOURCE_SHA256']:
              raise SystemExit('Embedded source checksum mismatch')
          root=Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tar:
              for member in tar:
                  destination=(root/member.name).resolve()
                  if not member.isfile() or not destination.is_relative_to(root):
                      raise SystemExit('Unsafe source archive member')
                  stream=tar.extractfile(member)
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  destination.write_bytes(stream.read())
          print('Restored public xshot source.')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare private signing key
        env:
          KEYSTORE_B64: ${{ secrets.XSHOT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.XSHOT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XSHOT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XSHOT_KEY_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,base64,secrets,subprocess
          from pathlib import Path
          vals=[os.environ.get(n,'') for n in ['KEYSTORE_B64','STORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD']]
          if any(vals) and not all(vals): raise SystemExit('Configure all four Android signing Secrets, or leave all four unset for a temporary test key.')
          path=Path(os.environ['RUNNER_TEMP'])/'xshot-signing.keystore'
          if all(vals):
              path.write_bytes(base64.b64decode(vals[0],validate=True));path.chmod(0o600)
              password,alias,keypass=vals[1:];mode='persistent'
          else:
              password=keypass=secrets.token_urlsafe(48);alias='xshot';mode='temporary'
              print('::add-mask::'+password,flush=True)
              subenv=dict(os.environ,XSHOT_TEMP_PASS=password)
              subprocess.run(['keytool','-genkeypair','-keystore',str(path),'-storetype','PKCS12','-alias',alias,'-storepass:env','XSHOT_TEMP_PASS','-keypass:env','XSHOT_TEMP_PASS','-keyalg','RSA','-keysize','3072','-validity','3650','-dname','CN=xshot'],env=subenv,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              path.chmod(0o600)
              print('::notice::Temporary signing key: use your own keystore Secrets before distributing continuous updates.')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for k,v in {'XSHOT_KEYSTORE_FILE':str(path),'XSHOT_KEYSTORE_PASSWORD':password,'XSHOT_KEY_ALIAS':alias,'XSHOT_KEY_PASSWORD':keypass,'XSHOT_SIGNING_MODE':mode}.items():
                  if '\n' in v or '\r' in v: raise SystemExit('Signing values must be single-line.')
                  f.write(k+'='+v+'\n')
          PY
      - name: Build and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon :app:assembleRelease
          mkdir -p build-reports/android
          cp android/app/build/outputs/apk/release/app-release.apk build-reports/android/xshot.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build-reports/android/xshot.apk > build-reports/android/signature.txt
          sha256sum build-reports/android/xshot.apk > build-reports/android/SHA256SUMS.txt
          printf 'name=xshot\nbuild=release\nsigning=%s\ngameplay_engine=not_recovered\n' "$XSHOT_SIGNING_MODE" > build-reports/android/build-info.txt
      - name: Remove private signing material
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP'])/'xshot-signing.keystore').unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xshot-android
          path: build-reports/android/
          if-no-files-found: error
  ios:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore xshot source if needed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,os,tarfile
          required=['backend/src/worker.mjs','android/app/build.gradle','ios/build_framework.sh']
          if all(Path(p).is_file() for p in required):
              print('Using checked-out xshot source.')
              raise SystemExit(0)
          data=base64.b64decode(os.environ['XSHOT_SOURCE_PAYLOAD'],validate=True)
          if hashlib.sha256(data).hexdigest()!=os.environ['XSHOT_SOURCE_SHA256']:
              raise SystemExit('Embedded source checksum mismatch')
          root=Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tar:
              for member in tar:
                  destination=(root/member.name).resolve()
                  if not member.isfile() or not destination.is_relative_to(root):
                      raise SystemExit('Unsafe source archive member')
                  stream=tar.extractfile(member)
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  destination.write_bytes(stream.read())
          print('Restored public xshot source.')
          PY
      - name: Build iPhone framework
        run: bash ios/build_framework.sh
      - name: Record framework hash
        run: shasum -a 256 ios/build/xshot.framework.zip > ios/build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xshot-ios
          path: |
            ios/build/xshot.framework.zip
            ios/build/SHA256SUMS.txt
          if-no-files-found: error
